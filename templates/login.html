<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Crowd Stampede Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="text-center mb-3">
        <span style="font-size: 40px;">🚨</span>
    </div>

    <h2 class="title">System Login</h2>
    <p class="subtitle">AI Crowd Density & Stampede Risk System</p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
            <label class="form-label">Email or Username</label>
            <input type="text" id="login_email" name="email" class="form-control" placeholder="Enter your email or username" required>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <label class="form-label mb-0">Password</label>
                <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none" style="font-size: 12px;">Forgot Password?</a>
            </div>
            <input type="password" id="login_password" name="password" class="form-control mt-1" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">
            Sign In
        </button>
    </form>

    <div class="text-center text-muted" style="font-size: 13px;">
        Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-primary text-decoration-none fw-semibold">Sign up</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
