<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCTV Connection</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


</head>


<body>


<div class="container mt-5">


<div class="card shadow p-4 mx-auto"
style="max-width:500px;">



<h3 class="text-center mb-4">

📹 Connect Live CCTV

</h3>




{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}


<div class="alert alert-{{category}}">

{{message}}

</div>


{% endfor %}

{% endif %}

{% endwith %}





<form method="POST"
action="{{ url_for('detection.connect_cctv') }}">





<div class="mb-3">


<label class="form-label">

Camera Name

</label>


<input
type="text"
name="camera_name"
class="form-control"
placeholder="Main Gate Camera"
required>


</div>






<div class="mb-3">


<label class="form-label">

RTSP URL

</label>


<input
type="text"
name="rtsp_url"
class="form-control"
placeholder="rtsp://username:password@ip:port/stream"
required>


</div>






<div class="mb-3">


<label class="form-label">

Username

</label>


<input
type="text"
name="username"
class="form-control">


</div>






<div class="mb-3">


<label class="form-label">

Password

</label>


<input
type="password"
name="password"
class="form-control">


</div>






<button
class="btn btn-primary w-100">

Connect CCTV

</button>





</form>


</div>


</div>


</body>

</html>
