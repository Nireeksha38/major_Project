<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Reset Password
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>



<body class="bg-light">



<div class="container mt-5">


    <div class="card shadow p-4 mx-auto" style="max-width:400px">


        <h3 class="text-center mb-4">

            Reset Password

        </h3>



        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">

                    {{ message }}

                </div>


            {% endfor %}

        {% endif %}

        {% endwith %}




        <form method="POST"
              action="{{ url_for('auth.reset_password', email=request.args.get('email')) }}">



            <div class="mb-3">


                <label class="form-label">

                    New Password

                </label>



                <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter new password"
                required>


            </div>




            <div class="mb-3">


                <label class="form-label">

                    Confirm Password

                </label>



                <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm password"
                required>


            </div>




            <button class="btn btn-success w-100">

                Update Password

            </button>



        </form>


    </div>


</div>



</body>


</html>
